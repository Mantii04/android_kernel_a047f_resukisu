name: Kernel build CI (AnyKernel3)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Restore cached clang
      id: clang-cache-restore
      uses: actions/cache/restore@v6
      with:
        path: toolchain
        key: ${{ runner.os }}-clang

    - name: Clone aosp clang
      if: steps.clang-cache-restore.outputs.cache-hit != 'true'
      run: |
        git clone --filter=blob:none --no-checkout --sparse --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/ toolchain
        pushd toolchain
        git sparse-checkout set clang-r596125
        git checkout
        popd

    - name: Save clang to cache
      id: clang-cache-save
      if: steps.clang-cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: toolchain
        key: ${{ runner.os }}-clang

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt-get install -y git-core gnupg flex bc bison build-essential zip curl cpio zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig

    - name: Configure and build kernel
      env:
        LOCALVERSION: "-ravindu644-Diamant"
      run: |
        export PATH="${{ github.workspace }}/toolchain/clang-r596125/bin/:$PATH"
        mkdir -p out
        ./scripts/kconfig/merge_config.sh -O out/ -m arch/arm64/configs/exynos850-a04sxx_defconfig arch/arm64/configs/lesdieuxx.config
        
        # --- BULLETPROOF FIX ---
        # Completely replace setlocalversion with a simple script that only outputs our version.
        # This prevents GitHub's "dirty" git tree from appending a "+" sign.
        echo '#!/bin/sh' > scripts/setlocalversion
        echo 'echo "$LOCALVERSION"' >> scripts/setlocalversion
        chmod +x scripts/setlocalversion
        
        # Remove any pre-existing localversion from config to avoid duplicates
        sed -i '/CONFIG_LOCALVERSION=/d' out/.config
        sed -i '/CONFIG_LOCALVERSION_AUTO=/d' out/.config
        
        make ARCH=arm64 LLVM=1 O=out olddefconfig
        make ARCH=arm64 LLVM=1 O=out -j$(nproc) LOCALVERSION="-ravindu644-Diamant"
        
        # --- VERIFICATION STEP ---
        # This prints the exact version that will be baked into the kernel.
        # Check this in the Actions log before downloading!
        echo "=========================================="
        echo "Kernel release version:"
        cat out/include/config/kernel.release
        echo "=========================================="

    - name: Create AnyKernel3 archive
      run: |
        pushd AnyKernel3
        cp ../out/arch/arm64/boot/Image .
        zip -r9 A04s-AnyKernel3.zip * -x .git README.md *placeholder
        popd

    - name: Upload AnyKernel3 zip
      uses: actions/upload-artifact@v7
      with:
        name: AnyKernel3
        path: AnyKernel3/A04s-AnyKernel3.zip
        archive: false
